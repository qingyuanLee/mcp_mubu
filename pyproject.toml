[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mubu-mcp"
version = "1.0.0"
description = "Mubu (幕布) MCP Server — manage Mubu outlines via Model Context Protocol with pluggable caching"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "mubu-mcp contributors" }]
keywords = ["mcp", "mubu", "outline", "markdown", "ai-agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "mcp[cli]>=2.0.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]
mongo = ["pymongo>=4.6.0"]
cosmos = ["azure-cosmos>=4.5.0"]
all = [
    "redis>=5.0.0",
    "pymongo>=4.6.0",
    "azure-cosmos>=4.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
mubu-mcp = "mubu_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mubu_mcp"]
